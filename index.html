<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Create your account</legend>

            <label for="name">Full name</label>
            <br>
            <input type="text" id="name" name="name" required>
            <br>
            
            <label for="email">Email</label>
            <br>
            <input type="email" name="email" id="email" required>
            <br>

            <label for="pass">Password</label>
            <br>
            <input type="password" name="password" id="pass" required>
            <br>

            <label for="phone">Phone</label>
            <br>
            <input type="tel" name="mobile" id="phone">
            <br>

            <label for="birth">Birth date</label>
            <br>
            <input type="date" name="birth date" id="birth">
            <br>

            <label for="country">Country</label>
            <br>
            <select name="country" id="country">
                <option>Choose a country</option>
                <option value="Jordan">Jordan</option>
                <option value="Palestine">Palestine</option>
                <option value="Egypt">Egypt</option>
            </select>
            <br>

            <label>Preferred contact</label>
            <br>
            <input type="radio" name="contact" value="email" id="rmail" required>
            <label for="rmail">Email</label>
            <input type="radio" name="contact" value="phone" id="rphone">
            <label for="rphone">Phone</label>
            <br>

            <input type="checkbox" value="accepted" id="accepted" name="terms" required>
            <label for="accepted">I accept the terms</label>
            <br>

            <button type="submit">Create account</button>
        </fieldset>

    </form>

</body>

</html>
